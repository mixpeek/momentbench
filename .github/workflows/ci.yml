name: CI

on:
  push:
    branches: [main]
    paths-ignore: [site/**]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,models,inspect]"
      - run: ruff check .
      - run: pytest -q
      - name: inspect eval on the seed set with a mock model
        run: inspect eval momentbench/agentic/inspect_task.py --model mockllm/model --display plain -T queries=data/queries/sample.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t momentbench .
      - run: docker run --rm momentbench agentic --help
