[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momentbench"
version = "0.1.0"
description = "Corpus-scale video moment retrieval benchmark"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Mixpeek", email = "team@mixpeek.com" }]
keywords = ["video", "retrieval", "benchmark", "temporal-grounding", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mixpeek>=0.18",
    "pydantic>=2.0",
    "httpx>=0.25",
    "click>=8.0",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "tqdm>=4.65",
]

[project.optional-dependencies]
models = [
    "openai>=1.30",
    "anthropic>=0.30",
    "google-genai>=1.0",
]
oss = [
    "openai>=1.30",
    "transformers>=4.45",
    "torch>=2.0",
    "numpy>=1.24",
    "open_clip_torch>=2.24",
]
site = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
hf = [
    "huggingface_hub>=0.23",
]
inspect = [
    "inspect_ai>=0.3.100",
]
claude-code = [
    "claude-agent-sdk>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
momentbench = "momentbench.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
